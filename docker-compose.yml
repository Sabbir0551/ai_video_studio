services:
  ai-video-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-video-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - STUDIO_ENV=production
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_RENDERS=2
      - AUDIO_TARGET_LUFS=-14.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
