[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-studio"
version = "0.1.0"
description = "Personal AI Video Studio (Text-to-Video + Auto Voiceover + Video Analysis & Auto-Editing)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Video Studio Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "pillow>=10.4.0",
    "edge-tts>=6.1.12",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
]

[project.scripts]
studio = "backend.app.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
